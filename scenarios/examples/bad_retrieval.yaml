id: demo-bad-retrieval-001
version: 1
name: Refund policy lookup with bad retrieval
query: Find the refund period for an annual subscription.

expected:
  required_tools:
    - search_policy
  required_claims:
    - "14 days"
  forbidden_claims:
    - "30 days"
  tool_outcomes:
    - tool_name: search_policy
      expected_success: true
      expected_call_count: 1

fault_profile:
  - fault_type: BAD_RETRIEVAL
    target_tool: search_policy
    trigger: FIRST_CALL
