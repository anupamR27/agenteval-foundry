services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenteval
      POSTGRES_USER: agenteval
      POSTGRES_PASSWORD: agenteval
    ports:
      - "5432:5432"
    volumes:
      - agenteval_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenteval -d agenteval"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agenteval_postgres_data:
