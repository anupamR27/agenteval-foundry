[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval-foundry"
version = "0.1.0"
description = "Evaluation and fault-injection framework for AI agents"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.13",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5"
]

[tool.setuptools]
packages = ["aut", "core", "dag", "evaluation", "evaluation.deterministic", "evaluation.taxonomy", "faults", "persistence", "persistence.postgres", "scenarios", "scripts", "tools", "tracing"]

[tool.setuptools.package-data]
"evaluation.taxonomy" = ["taxonomy.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration_db: requires a PostgreSQL database configured by TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 100
target-version = "py311"
