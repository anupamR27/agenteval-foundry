[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval-foundry"
version = "0.1.0"
description = "Evaluation and fault-injection framework for AI agents"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5"
]

[tool.setuptools]
packages = ["aut", "core", "scenarios", "scripts", "tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
